{% extends "base.html" %}
{% block title %}Đăng nhập · Kỷ niệm của tôi{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Nhập mật khẩu để xem kỷ niệm</h1>
  {% for m in get_flashed_messages() %}<p class="error">{{ m }}</p>{% endfor %}
  <form method="post" class="stack">
    <label>Mật khẩu <input type="password" name="password" autofocus required></label>
    <button class="btn">Đăng nhập</button>
  </form>
</section>
{% endblock %}
