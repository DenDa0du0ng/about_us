<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kỷ niệm của tôi{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('index') }}">Kỷ niệm của tôi</a>
    <nav>
      <a href="{{ url_for('index') }}" {% if request.endpoint in ('index','memory') %}aria-current="page"{% endif %}>Dòng thời gian</a>
      <a href="{{ url_for('all_photos') }}" {% if request.endpoint == 'all_photos' %}aria-current="page"{% endif %}>Tất cả ảnh</a>
      <a class="btn small" href="{{ url_for('new_memory') }}">Thêm kỷ niệm</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" aria-label="Đóng">×</button>
    <button class="lb-nav lb-prev" aria-label="Ảnh trước">‹</button>
    <figure>
      <img alt="">
      <figcaption></figcaption>
    </figure>
    <button class="lb-nav lb-next" aria-label="Ảnh sau">›</button>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
